name: Check upstream updates

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REPOSITORY: EEliberto/IPA-Download
      UPSTREAM_BRANCH: main
      BASE_BRANCH: agent/version-record-time
      SYNC_BRANCH: automation/sync-upstream
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0
      - name: Create or refresh an upstream sync pull request
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git" || true
          git fetch upstream "${UPSTREAM_BRANCH}"
          behind="$(gh api "repos/${UPSTREAM_REPOSITORY}/compare/${UPSTREAM_BRANCH}...${GITHUB_REPOSITORY_OWNER}:${BASE_BRANCH}" --jq '.behind_by')"
          if [ "${behind}" -eq 0 ]; then
            echo "Already up to date."
            exit 0
          fi
          existing_pr="$(gh pr list --base "${BASE_BRANCH}" --head "${SYNC_BRANCH}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${existing_pr}" ]; then
            git fetch origin "${SYNC_BRANCH}"
            if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" "origin/${SYNC_BRANCH}"; then
              echo "Existing sync PR #${existing_pr} already contains the latest upstream commit."
              exit 0
            fi
            git switch --force-create "${SYNC_BRANCH}" "origin/${SYNC_BRANCH}"
          else
            git switch --force-create "${SYNC_BRANCH}" "${BASE_BRANCH}"
          fi
          git merge --no-edit "upstream/${UPSTREAM_BRANCH}"
          git push --force-with-lease origin "${SYNC_BRANCH}"
          if [ -z "${existing_pr}" ]; then
            gh pr create --base "${BASE_BRANCH}" --head "${SYNC_BRANCH}" --title "chore: sync upstream ${UPSTREAM_REPOSITORY}" --body "Automated weekly upstream sync check. Review and merge when ready."
          fi
